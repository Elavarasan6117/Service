name: chennai-serviceability

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: svc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serviceability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-serviceability}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serviceability} -d ${POSTGRES_DB:-serviceability}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [svcnet]

  redis:
    image: redis:7-alpine
    container_name: svc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [svcnet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: svc-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [svcnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: svc-frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [svcnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: svc-nginx
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx.conf `include`s this; both files must be mounted.
      - ./deploy/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    networks: [svcnet]

  # ---------------------------------------------------------------------
  # Optional self-hosted routing engine. Enable with:
  #   docker compose --profile osrm up -d
  # Prepare data first: ./scripts/prepare_osrm.sh
  # ---------------------------------------------------------------------
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: svc-osrm
    restart: unless-stopped
    profiles: [osrm]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/southern-zone-latest.osrm"]
    volumes:
      - ./deploy/osrm-data:/data
    networks: [svcnet]

  prometheus:
    image: prom/prometheus:latest
    container_name: svc-prometheus
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [svcnet]

  grafana:
    image: grafana/grafana:latest
    container_name: svc-grafana
    restart: unless-stopped
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks: [svcnet]

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

networks:
  svcnet:
    driver: bridge
