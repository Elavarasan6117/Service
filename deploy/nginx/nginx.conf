# Edge proxy. Terminates TLS in production (add the ssl block and certificates),
# serves the SPA, and proxies the API.
#
# The browser only ever talks to this server. It never contacts Google Maps,
# because every provider call is made server-side by the backend.

upstream backend_api { server backend:8000; }
upstream frontend_app { server frontend:80; }

# Modest connection limits at the edge, ahead of the application's own
# per-user rate limits.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;   # import uploads
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # In production, uncomment after TLS is configured:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy: the app loads its own bundle plus OSM tiles.
    # No script or connect origin other than 'self' is required, because there
    # is no client-side mapping SDK and no direct call to any provider.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/proxy_common.conf;
    }

    # Server-Sent Events. Buffering must be off or events queue up in nginx
    # instead of reaching the dashboard, and the read timeout must be long or
    # the stream is cut every 60 seconds.
    location /api/v1/stream {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/proxy_common.conf;
    }

    location = /health {
        proxy_pass http://backend_api;
        include /etc/nginx/proxy_common.conf;
        access_log off;
    }

    # /metrics is deliberately NOT exposed here. Scrape the backend directly
    # from the monitoring network.
    location = /metrics { return 404; }

    location / {
        proxy_pass http://frontend_app;
        include /etc/nginx/proxy_common.conf;
    }
}
